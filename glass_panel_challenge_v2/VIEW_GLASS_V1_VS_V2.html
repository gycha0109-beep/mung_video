</head><body><main><h1>유리판 20장 챌린지 · V1 / V2</h1><p>같은 8초·24fps·720×1280 기준의 연출 비교입니다. V2는 유리 조각의 형태·충돌 직후 움직임·카메라 거리·소리를 개선한 시안입니다. 관통 개수는 양쪽 모두 17/20이며 정밀 물리실험 결과가 아닙니다.</p>

<script>const a=document.querySelector('#a'),b=document.querySelector('#b');document.querySelector('#play').onclick=()=>{a.pause();b.pause();a.currentTime=b.currentTime=0;Promise.allSettled([a.play(),b.play()])};document.querySelector('#pause').onclick=()=>{a.pause();b.pause()};document.querySelector('#impact').onclick=()=>{a.pause();b.pause();a.currentTime=b.currentTime=2.3;Promise.allSettled([a.play(),b.play()])};</script></body></html>
